name: Build and publish container

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: bazel

      - name: Build OCI image
        run: bazel build //:paper

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        if: github.event_name != 'pull_request'
        id: image
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Write image tags for Bazel
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.image.outputs.tag-names }}
        run: |
          printf '%s\n' "$TAGS" > image_tags.txt
          printf 'ghcr.io/%s\n' "$GITHUB_REPOSITORY" > image_destination.txt

      - name: Push image with Bazel
        if: github.event_name != 'pull_request'
        run: bazel run //:paper_push
